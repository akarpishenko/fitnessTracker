version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: anastasiiakarpishenko
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: fitness_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/fitness_tracker
      SPRING_DATASOURCE_USERNAME: anastasiiakarpishenko
      SPRING_DATASOURCE_PASSWORD: 12345
    depends_on:
      - db

volumes:
  postgres_data: